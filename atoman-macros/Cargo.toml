[package]
name = "atoman-macros"
description = "The atoman attribute macros (atoman::main, atoman::test)."
version = "0.1.0"
license = "MIT"
authors = ["Bulat Sh. <synapdrake@ya.ru>"]
repository = "https://github.com/fuderis/atoman-rs/blob/main/atoman-macros"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
