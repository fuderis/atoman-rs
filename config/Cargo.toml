[package]
name = "atoman-config"
description = "The config implementation macros for atoman crate"
version = "0.2.0"
license = "MIT"
authors = ["Bulat Sh. <synapdrake@ya.ru>"]
repository = "https://github.com/fuderis/atoman-rs/blob/main/config"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
heck = "0.4"
